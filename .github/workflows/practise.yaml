name: final-lab-exam

on:
  push:
    branches:
      - main
  
jobs:
  ml-pipeline:
    runs-on: ubuntu-latest
    steps:
      # 1. سحب الكود
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # 2. فحص جودة الكود كخطوة أولى
      - name: Check Code Quality
        run: |
          pip install flake8
          flake8 .
          
      # 3. تدريب النموذج فقط إذا تم ذكره في رسالة الـ commit
      # قمنا بإعطاء هذه الخطوة "id" لكي نستطيع معرفة حالتها في الخطوات القادمة
      - name: Train Model
        if: contains(github.event.head_commit.message, 'training')
        run: python model_training.py > train_log.txt 2>&1

      # 4. حفظ السجلات (Logs) في حال فشل خطوة التدريب تحديداً
      - name: Upload Logs on Failure
        if: failure() && steps.train_step.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: train_log.txt

      # 5. التقييم التلقائي في حال نجاح خطوة التدريب
      - name: Evaluate Model
        if: success() && steps.train_step.outcome == 'success'
        run: python model_evaluation.py

      # 6. تنظيف الموارد المؤقتة دائماً (في جميع الأحوال سواء نجاح أو فشل)
      - name: Cleanup Temporary Resources
        if: always()
        run: |
          echo "Cleaning up resources..."
          # مثلاً: مسح الملفات المؤقتة
          rm -rf temp_data/ || true
